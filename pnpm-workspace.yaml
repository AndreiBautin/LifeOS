# Dependency install scripts, answered explicitly.
#
# Both build artefacts for server runtimes that nothing in a browser
# bundle reaches. Declining is the right default — the less third-party
# code that executes on this machine at install time the better — and an
# unanswered entry here fails `pnpm install`, which no CI can resolve.
allowBuilds:
  '@firebase/util': false
  protobufjs: false
