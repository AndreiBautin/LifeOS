name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway — a half-published
# site is worse than an out-of-date one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The deploy is gated on the same verification CI runs. Duplicated
  # minutes are cheap; a pipeline that can publish a commit which failed
  # its own tests is decorative.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # A GitHub project page serves from /<repo>/, and both the
          # bundler's asset paths and the router's basename derive from
          # this one value. Getting it wrong is how a static SPA deploy
          # ends up with working assets and a 404 on every route.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_LOG_LEVEL: warn

          # Repository *variables*, not secrets, and deliberately so: a
          # Firebase web config identifies a project and authorises
          # nothing. Access is decided entirely by firestore.rules. Hiding
          # them as secrets would imply a confidentiality they do not
          # have, and would make a deploy failure harder to diagnose.
          #
          # Unset is a supported state, not a broken one. A fork with no
          # variables configured builds an app whose Settings screen says
          # sync is not configured, and which behaves exactly as it did
          # before sync existed. That is why these are not defaulted to
          # this project's values: someone else's fork must not write into
          # it.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: pnpm build

      # Static hosts 404 on a client-side route requested cold. Serving
      # the shell as the 404 document turns that into a working deep link.
      # The status code stays 404, which is honest but invisible to a user.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # A green deploy step means an upload succeeded. A green smoke test
      # means the site answered.
      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Fetching $url"

          for attempt in 1 2 3 4 5; do
            if body=$(curl --fail --silent --show-error --location "$url"); then
              break
            fi
            echo "Attempt $attempt failed; Pages may still be propagating."
            sleep 10
          done

          echo "$body" | grep -q '<div id="root">' \
            || { echo "The response did not contain the app shell."; exit 1; }
          echo "$body" | grep -q 'manifest.webmanifest' \
            || { echo "The response did not link the web manifest."; exit 1; }

          echo "Live site responded with the app shell and a manifest."
